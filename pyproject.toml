[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "temporal-gnn-market-risk"
version = "0.1.0"
description = "Temporal GNNs for cross-asset connectedness and crash AUPRC"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Hossein Tabasi"}]
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "torch", "scikit-learn", "pyyaml", "matplotlib"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]
geo = ["torch-geometric"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
